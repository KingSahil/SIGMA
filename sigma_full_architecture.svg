<text x="118" y="406" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5DCAA5">IQ · WAV</text>

<rect x="197" y="368" width="116" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="255" y="388" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">L2 analyze</text>
<text x="255" y="406" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5DCAA5">symbol rate</text>

<rect x="334" y="368" width="116" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.5"/>
<text x="392" y="388" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#9FE1CB">L3 demod</text>
<text x="392" y="406" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5DCAA5">sync · FEC</text>

<rect x="490" y="368" width="150" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="565" y="388" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#B5D4F4">Google Gemini</text>
<text x="565" y="406" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#85B7EB">embeddings + chat</text>

<path d="M255 446 L255 486" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M565 424 L565 486" fill="none" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="486" width="600" height="56" rx="8" fill="#0C447C" stroke="#85B7EB" stroke-width="0.5"/>
<text x="340" y="506" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#B5D4F4">Data layer</text>
<text x="340" y="524" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#85B7EB">sigma.db · sigma_rag.sqlite3 · data/iq · uploads · docs</text>
</svg>
